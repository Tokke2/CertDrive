name: Keep IntygsDrive release in sync

on:
  push:
    branches:
      - arena/4ce9e107-certdrive
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Update the rolling v0.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: 0.0.1
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          cat > "$notes_file" <<EOF
          IntygsDrive app version: ${APP_VERSION}

          This rolling release is synchronized with branch \`${RELEASE_BRANCH}\`.
          Source commit: \`${RELEASE_COMMIT}\`.

          The app version intentionally remains ${APP_VERSION} until the maintainer requests a version change.
          EOF

          git tag --force "$tag" "$RELEASE_COMMIT"
          git push --force origin "refs/tags/${tag}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "IntygsDrive ${APP_VERSION}" \
              --notes-file "$notes_file" \
              --latest
          else
            gh release create "$tag" \
              --target "$RELEASE_COMMIT" \
              --title "IntygsDrive ${APP_VERSION}" \
              --notes-file "$notes_file" \
              --latest
          fi
